name: Build Firmware

on:
  push:
    branches: [ main ]
    paths:
      - src/**
      - include/**
      - lib/**
      - scripts/**
      - platformio.ini
      - .github/workflows/build-firmware.yml
  pull_request:
    paths:
      - src/**
      - include/**
      - lib/**
      - scripts/**
      - platformio.ini
      - .github/workflows/build-firmware.yml
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PIO_ENV: 4d_systems_esp32s3_gen4_r8n16

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO Core
        run: pip install platformio

      - name: Inject GROQ_API_KEY (CI)
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import re

          key = os.environ.get("GROQ_API_KEY", "")
          def q(v: str) -> str:
            return v.replace("\\", "\\\\").replace('"', '\\"')

          path = "include/secrets.h"
          with open(path, "r", encoding="utf-8") as f:
            content = f.read()

          pattern = r'^#define\s+GROQ_API_KEY\s+".*"\s*$'
          replacement = f'#define GROQ_API_KEY "{q(key)}"'
          if re.search(pattern, content, flags=re.MULTILINE):
            content = re.sub(pattern, replacement, content, flags=re.MULTILINE)
          else:
            content = content.rstrip() + "\n" + replacement + "\n"

          with open(path, "w", encoding="utf-8") as f:
            f.write(content)
          PY

      - name: Install dependencies
        run: pio pkg install -e $PIO_ENV

      - name: Generate auto tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: auto_tag
        run: echo "tag=v0.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Derive FW_VERSION from tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: fw_version
        run: echo "value=${{ steps.auto_tag.outputs.tag }}" | sed 's/value=v/value=/' >> "$GITHUB_OUTPUT"

      - name: Build firmware (main push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FW_VERSION_OVERRIDE: ${{ steps.fw_version.outputs.value }}
        run: pio run -e $PIO_ENV

      - name: Build firmware (non-release events)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: pio run -e $PIO_ENV

      - name: Prepare firmware.bin
        shell: bash
        run: |
          mkdir -p dist
          cp .pio/build/$PIO_ENV/firmware.bin dist/firmware.bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: dist/firmware.bin

      - name: Create Git tag in repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.auto_tag.outputs.tag }}';
            const sha = context.sha;
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha,
              });
            } catch (e) {
              if (e.status === 422) {
                core.info(`Tag ${tag} already exists, reusing it.`);
              } else {
                throw e;
              }
            }

      - name: Create release and upload firmware.bin
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.auto_tag.outputs.tag }}
          name: ${{ steps.auto_tag.outputs.tag }}
          generate_release_notes: true
          files: dist/firmware.bin
          fail_on_unmatched_files: true

name: Build Firmware

on:
  push:
    branches: [ main ]
    paths:
      - main/**
      - components/**
      - scripts/**
      - platformio.ini
      - partitions.csv
      - requirements.txt
      - .github/**
  pull_request:
    paths:
      - main/**
      - components/**
      - scripts/**
      - platformio.ini
      - partitions.csv
      - requirements.txt
      - .github/**
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PIO_ENV: atlas

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Manifest Validation Tests
        run: |
          python scripts/test_manifest_validation.py
          python APPS/tools/validate_apps.py

      - name: Install PlatformIO dependencies
        run: pio pkg install -e $PIO_ENV

      - name: Generate auto tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: auto_tag
        run: echo "tag=v0.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Derive FW_VERSION from tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: fw_version
        run: echo "value=${{ steps.auto_tag.outputs.tag }}" | sed 's/value=v/value=/' >> "$GITHUB_OUTPUT"

      - name: Build firmware (main push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FW_VERSION_OVERRIDE: ${{ steps.fw_version.outputs.value }}
        run: pio run -e $PIO_ENV

      - name: Build firmware (non-release events)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: pio run -e $PIO_ENV

      - name: Prepare firmware.bin
        shell: bash
        run: |
          mkdir -p dist
          cp .pio/build/$PIO_ENV/firmware.bin dist/firmware.bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: dist/firmware.bin

      - name: Create Git tag in repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.auto_tag.outputs.tag }}';
            const sha = context.sha;
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha,
              });
            } catch (e) {
              if (e.status === 422) {
                core.info(`Tag ${tag} already exists, reusing it.`);
              } else {
                throw e;
              }
            }

      - name: Create release and upload firmware.bin
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.auto_tag.outputs.tag }}
          name: ${{ steps.auto_tag.outputs.tag }}
          generate_release_notes: true
          files: dist/firmware.bin
          fail_on_unmatched_files: true
